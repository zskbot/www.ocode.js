<style>
:root{color-scheme:dark;--bg:#05070d;--panel:#0a101c;--line:#26364f;--line-strong:#36577f;--fg:#f2f5fb;--muted:#a3afc2;--blue:#347cff;--cyan:#55c8ff;--purple:#a34cff;--yellow:#f3d44e;--pink:#e45ac8;--green:#57d6a2;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
@media(max-width:768px){
  html,body{width:100%;height:100%;min-height:100%;overflow-x:hidden;overscroll-behavior:none;touch-action:pan-x pan-y}
  body{min-height:100dvh;min-height:100svh}
  .layout{min-height:100dvh;min-height:100svh;height:auto}
  .topbar{padding-top:calc(8px + env(safe-area-inset-top,0px))}
  .sidebar{padding-bottom:env(safe-area-inset-bottom,0px)}
  .content{min-width:0;max-width:100vw;overflow-wrap:anywhere}
}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--mono)}
button,input,select{font:inherit}
a{color:inherit;text-decoration:none}
button,a,input,select{touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
button{cursor:pointer}
.layout{min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:64px 1fr auto;max-width:1680px;margin:0 auto;border:1px solid var(--line);background:linear-gradient(135deg,#070b13,#05070d 55%)}
.sidebar{grid-column:1;grid-row:1/4;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;min-height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 26px;border-bottom:1px solid var(--line);font-weight:800;font-size:20px;letter-spacing:-1px}
.brand-mark{font-size:34px;line-height:1;color:var(--blue);text-shadow:5px 4px 0 var(--purple)}
.brand small{display:block;color:var(--blue);font-size:12px;letter-spacing:1px}
.nav{display:grid;gap:6px;margin-top:24px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid transparent;color:var(--muted);font-size:14px}
.nav a:hover,.nav a.active{background:#173c9c;border-color:#356fff;color:#fff}
.nav-icon{width:18px;text-align:center;font-size:16px}
.side-card{margin-top:auto;border:1px solid var(--line-strong);padding:12px;background:#080e19}
.side-card strong{display:block;margin-bottom:5px}
.side-card p{margin:0;color:var(--muted);font-size:12px}
.version{display:inline-block;margin-top:10px;border:1px solid var(--purple);padding:2px 7px;color:#c9a2ff;font-size:11px}
.topbar{grid-column:2;grid-row:1;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:0 22px}
.mbrand{display:none}
.icon-button,.shortcut{height:38px;min-width:40px;border:1px solid var(--line-strong);border-radius:0;background:transparent;color:var(--fg);padding:0 12px}
.shortcut{display:flex;align-items:center;gap:10px;color:var(--muted)}
.submit-tool{height:38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--blue);background:#102b67;color:#fff;padding:0 14px;font-size:12px;font-weight:700;white-space:nowrap}
.submit-tool:hover{background:#1b43a0;border-color:var(--cyan)}
.content{grid-column:2;grid-row:2;min-width:0;padding:clamp(22px,4vw,48px)}
.hero{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:24px;margin:0 0 26px}
.hero-mark{font-size:74px;line-height:1;color:var(--blue);text-shadow:10px 7px 0 var(--purple)}
h1{margin:0;font-size:clamp(28px,4vw,54px);line-height:1.1;letter-spacing:-2px}
h1 span{color:var(--blue)}
.subtitle{margin:12px 0 0;color:var(--muted);font-size:15px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 30px}
.stat{min-height:42px;display:flex;align-items:center;gap:10px;border:1px solid var(--line-strong);padding:8px 14px;background:#080e19;white-space:nowrap}
.stat:nth-child(1){border-color:#c3a92c;color:var(--yellow)}
.stat:nth-child(2){border-color:#267db5;color:var(--cyan)}
.stat:nth-child(3){border-color:#8b42d3;color:#c28bff}
.stat:nth-child(4){border-color:#4a9fbd;color:#8de4ff}
.searchbar{display:grid;grid-template-columns:minmax(0,1fr) 190px 190px 120px;gap:12px;margin-bottom:28px}
.searchbox,.filter,.search-submit{height:52px;border:1px solid var(--line-strong);border-radius:0;background:#070c15;color:var(--fg);padding:0 15px;min-width:0}
.searchbox{display:flex;align-items:center;gap:12px}
.searchbox input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--fg)}
.searchbox input:focus-visible{outline:0}
.searchbox:focus-within{border-color:var(--cyan)}
.filter{width:100%;appearance:none}
.search-submit{background:#2859e8;border-color:#3c70ff;color:#fff;font-weight:700}
.search-submit:hover{background:#3970ff}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 12px;scroll-margin-top:80px}
.section-head h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.result-count{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{min-width:0;border:1px solid var(--line-strong);background:linear-gradient(145deg,#0a101b,#070b13);padding:15px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.card:nth-child(4n+1){border-top:2px solid var(--blue)}
.card:nth-child(4n+2){border-top:2px solid var(--purple)}
.card:nth-child(4n+3){border-top:2px solid var(--cyan)}
.card:nth-child(4n){border-top:2px solid var(--pink)}
.card:hover{border-color:var(--blue)}
.card-head{display:flex;align-items:center;gap:12px;min-width:0}
.tool-icon{flex:0 0 44px;width:44px;height:44px;display:grid;place-items:center;border:2px solid var(--cyan);color:var(--cyan);font-weight:800;font-size:15px}
.card:nth-child(4n+2) .tool-icon{border-color:var(--purple);color:#c69aff}
.card:nth-child(4n) .tool-icon{border-color:var(--pink);color:#f08add}
.card h3{margin:0;font-size:16px;overflow-wrap:anywhere}
.card p{min-height:44px;margin:0;color:var(--muted);font-size:12px}
.meta{display:flex;align-items:center;gap:10px;color:var(--blue);font-size:12px;flex-wrap:wrap}
.meta span+span{color:var(--muted)}
.card-actions{display:flex;align-items:center;gap:7px;margin-top:auto;flex-wrap:wrap}
.btn{min-height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-strong);border-radius:0;background:#0a1322;color:var(--fg);padding:6px 10px;font-size:11px}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.primary{background:#173d9f;border-color:#3976ff;color:#fff}
.btn.favorite[aria-pressed=true]{color:var(--yellow);border-color:var(--yellow)}
.empty{grid-column:1/-1;border:1px dashed var(--line-strong);padding:28px;text-align:center;color:var(--muted)}
.detail{max-width:760px}
.detail h2{font-size:30px;margin:16px 0 8px;overflow-wrap:anywhere}
.detail-panel{margin-top:16px;border:1px solid var(--line-strong);padding:16px;background:var(--panel);min-width:0}
.command{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;color:var(--green);font-size:12px;margin:10px 0 14px}
.back{height:40px;border:1px solid var(--line-strong);border-radius:0;background:transparent;color:var(--fg);padding:0 14px}
footer{grid-column:2;grid-row:3;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding:16px 22px;color:var(--muted);font-size:12px}
footer a{padding:0 8px}

@media(max-width:1100px){
  .searchbar{grid-template-columns:minmax(0,1fr) minmax(150px,1fr) minmax(150px,1fr)}
  .search-submit{grid-column:1/-1}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ===== Mobile: header cố định phía trên, thanh điều hướng cố định phía dưới ===== */
@media(max-width:768px){
  html,body{width:100%;overflow-x:hidden}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .layout{display:block;min-height:100svh;border:0;background:var(--bg)}

  /* Header */
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;height:auto;padding:calc(8px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 8px calc(14px + env(safe-area-inset-left,0px));background:rgba(5,7,13,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .mbrand{display:flex;align-items:center;gap:8px;min-width:0;margin-right:auto;font-weight:800;font-size:16px;letter-spacing:-.5px}
  .mbrand b{font-size:22px;line-height:1;color:var(--blue);text-shadow:3px 2px 0 var(--purple)}
  .mbrand small{color:var(--blue);font-size:10px;letter-spacing:1px;margin-left:2px}
  .shortcut{display:none}
  .submit-tool,.icon-button{height:38px;min-height:38px;padding:0 11px;font-size:12px}
  .icon-button{min-width:38px}

  /* Sidebar -> bottom tab bar */
  .sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;min-height:0;padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);border:0;border-top:1px solid var(--line-strong);background:rgba(8,12,21,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .brand,.side-card{display:none}
  .nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin:0}
  .nav a{flex-direction:column;justify-content:center;gap:2px;min-height:56px;padding:6px 2px;font-size:10px;text-align:center;border:0;border-top:2px solid transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav a:hover,.nav a.active{background:#10265f;border-top-color:var(--cyan);color:#fff}
  .nav-icon{width:auto;font-size:17px;line-height:1}

  /* Nội dung */
  .content{padding:16px calc(14px + env(safe-area-inset-right,0px)) 24px calc(14px + env(safe-area-inset-left,0px))}
  .hero{display:block;margin:0 0 12px}
  .hero-mark{display:none}
  h1{font-size:clamp(26px,8vw,32px);line-height:1.15;letter-spacing:-.8px}
  .subtitle{margin-top:6px;font-size:13px;line-height:1.45}

  /* Stats: một hàng cuộn ngang thay vì lưới 2x2 chiếm chỗ */
  .stats{flex-wrap:nowrap;gap:8px;margin:14px -14px 14px;padding:0 14px 4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .stats::-webkit-scrollbar{display:none}
  .stat{flex:0 0 auto;min-height:32px;padding:5px 10px;font-size:11px}

  /* Tìm kiếm: ô tìm full width, 2 bộ lọc cùng hàng */
  .searchbar{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 14px}
  .searchbox{grid-column:1/-1}
  .searchbox,.filter{height:46px;padding:0 12px}
  .searchbox input{font-size:16px;height:100%}
  .filter{font-size:14px;appearance:auto}
  .search-submit{display:none}

  .section-head{margin:14px 0 10px;scroll-margin-top:70px}
  .section-head h2{font-size:12px}
  .result-count{font-size:11px}

  .grid{grid-template-columns:minmax(0,1fr);gap:10px}
  .card{padding:12px;gap:8px;border-top-width:2px}
  .tool-icon{flex-basis:40px;width:40px;height:40px;font-size:13px;border-width:1px}
  .card h3{font-size:15px}
  .card p{min-height:0;font-size:12.5px}
  .meta{font-size:11px;gap:8px}

  /* Nút trong card: View chiếm phần lớn, các nút còn lại gọn bên cạnh */
  .card-actions{display:grid;grid-template-columns:1fr auto auto 44px;gap:6px}
  .card-actions .btn{min-height:42px;padding:0 12px;font-size:12px;white-space:nowrap}
  .btn.favorite{font-size:18px;padding:0}

  .detail h2{font-size:24px}
  .detail-panel{padding:12px}
  .back{width:100%;height:44px}
  .detail .btn.primary{width:100%;min-height:44px}

  footer{display:block;padding:14px calc(14px + env(safe-area-inset-right,0px)) 14px calc(14px + env(safe-area-inset-left,0px));font-size:11px;line-height:1.9}
  footer span{display:block}
  footer a{padding:0 6px 0 0}
  button,.btn,.icon-button,.submit-tool,.back,input,select,.filter,.searchbox,.stat,.card,.detail-panel{border-radius:0!important}
}
@media(max-width:360px){
  .mbrand small{display:none}
  .submit-tool{padding:0 8px;font-size:11px}
  .card-actions{grid-template-columns:1fr 1fr 44px}
  .card-actions .btn.primary{grid-column:1/-1}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}

.light-preview .layout{background:#edf2fb;color:#101827}
.light-preview .sidebar,.light-preview .topbar,.light-preview footer{background:#f7f9fd;color:#263449}
.light-preview .brand small,.light-preview .mbrand small,.light-preview .meta,.light-preview .result-count{color:#245ac7}
.light-preview .nav a{color:#34445c}
.light-preview .nav a:hover,.light-preview .nav a.active{background:#dce8ff;color:#102b61}
.light-preview .side-card,.light-preview .card,.light-preview .detail-panel,.light-preview .searchbox,.light-preview .filter,.light-preview .shortcut,.light-preview .icon-button,.light-preview .btn,.light-preview .stat{background:#fff;color:#17243a}
.light-preview .btn.primary,.light-preview .submit-tool{color:#fff}
.light-preview .btn.primary{background:#173d9f}
.light-preview .card p,.light-preview .section-head h2,.light-preview .subtitle{color:#52627a}
.light-preview .command{background:#f2f6fc;color:#08764d;padding:8px}
.light-preview .card,.light-preview .layout{border-color:#9eb4d4}
@media(max-width:768px){.light-preview .topbar{background:rgba(247,249,253,.94)}.light-preview .sidebar{background:rgba(247,249,253,.97)}}

/* OCode.js UI system: 8pt spacing, fluid canvas, accessible touch targets. */
:root{
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;
  --space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;
  --content-max:1200px;--mobile-gutter:16px;
}
*,*::before,*::after{box-sizing:border-box}
html{width:100%;max-width:100%;overflow-x:hidden}
body{width:100%;max-width:100%;margin:0;overflow-x:hidden}
.layout{width:100%;max-width:100%;min-width:0}
.content{width:100%;max-width:calc(var(--content-max) + 2 * var(--space-6));min-width:0;margin-inline:auto}
button,a,input,select,textarea{font:inherit}
button,.btn,.icon-button,.shortcut,.submit-tool,.search-submit,.back,.nav a{
  border-radius:0!important
}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--cyan);outline-offset:2px
}
@media(min-width:1200px){
  .content{padding-inline:clamp(32px,5vw,80px)}
  .stats{gap:16px;margin-block:32px}
  .searchbar{gap:12px;margin-bottom:32px}
  .grid{gap:16px}
  .card{padding:16px}
  .section-head{margin-block:32px 16px}
}
@media(min-width:769px) and (max-width:1199px){
  .content{padding:32px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  :root{--mobile-gutter:16px}
  .content{padding:24px var(--mobile-gutter) 32px}
  .hero{gap:16px;margin-bottom:24px}
  h1{font-size:clamp(28px,7vw,32px);line-height:1.2;letter-spacing:-.8px}
  .subtitle{font-size:14px;line-height:1.5}
  .stats{gap:8px;margin:24px 0}
  .stat{min-height:40px;padding:8px}
  .searchbar{gap:8px;margin-bottom:32px}
  .searchbox,.filter{height:44px;min-height:44px;padding-inline:12px}
  .search-submit{height:48px;min-height:48px;padding-inline:16px}
  .grid{gap:12px}
  .card{padding:16px;gap:12px}
  .card-actions{gap:8px}
  .card-actions .btn{min-height:36px;padding:8px 12px}
  .section-head{margin:24px 0 12px}
  .topbar{padding-inline:16px}
  .submit-tool{min-height:40px;padding-inline:16px}
  .icon-button,.shortcut{min-height:40px}
  .nav{gap:8px}
  .nav a{min-height:40px;padding:8px 12px}
  footer{gap:12px;padding:16px}
}
@media(max-width:420px){
  .content{padding:24px 16px 32px}
  .hero{margin-bottom:16px}
  h1{font-size:28px}
  .subtitle{font-size:13px}
  .stats{gap:8px;margin:16px 0 24px}
  .stat{min-height:36px;padding:8px;font-size:10px}
  .searchbar{gap:8px;margin-bottom:32px}
  .searchbox,.filter{height:44px;min-height:44px}
  .search-submit{height:48px;min-height:48px}
  .card{padding:12px}
  .card-actions .btn{min-height:36px}
}
/* Maintain the explicit 100% square-corner visual requirement. */
button,.btn,.icon-button,.shortcut,.submit-tool,.search-submit,.back,input,select,textarea,.filter,.searchbox,.stat,.card,.detail-panel,.nav a{border-radius:0!important}

</style>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tools=[],query="",category="",language="",view="home",favorites=new Set();
try{favorites=new Set(JSON.parse(localStorage.getItem("ocodejs-cli-favorites")||"[]"))}catch{}
const icons={"ripgrep":"rg","fd":"fd","fzf":"fzf","lazygit":"lg","k9s":"k9s","jq":"jq","yq":"yq","dnspyre":"dns","cli-anything-hub":"AI","clihub":"CH"};
function filtered(){const q=query.trim().toLocaleLowerCase("vi");return tools.filter(t=>(!category||t.category===category)&&(!language||t.language===language)&&(!q||[t.name,t.description,t.language,t.category,t.install].join(" ").toLocaleLowerCase("vi").includes(q))&&(view!=="favorites"||favorites.has(t.id)))}
function card(t){return `<article class="card"><div class="card-head"><span class="tool-icon">${esc(icons[t.id]||t.name.slice(0,3))}</span><h3>${esc(t.name)}</h3></div><p>${esc(t.description)}</p><div class="meta"><span>${esc(t.language)}</span><span>• ${esc(t.category)}</span></div><div class="card-actions"><button class="btn primary" data-detail="${esc(t.id)}" type="button">View →</button><button class="btn" data-copy="${esc(t.install)}" type="button">Copy</button><a class="btn" href="${esc(t.repo)}" target="_blank" rel="noopener noreferrer">GitHub ↗</a><button class="btn favorite" data-fav="${esc(t.id)}" aria-pressed="${favorites.has(t.id)}" aria-label="Toggle favorite" type="button">${favorites.has(t.id)?"★":"☆"}</button></div></article>`}
function render(){
 const result=filtered(),categories=[...new Set(tools.map(t=>t.category))].sort(),languages=[...new Set(tools.map(t=>t.language))].sort();
 const title=view==="favorites"?"Favorites":view==="about"?"About OCode.js":"Discover, explore and use the best CLI tools for developers.";
 $("#app").innerHTML=`<section class="hero"><div class="hero-mark">&gt;_</div><div><h1>OCode.js <span>CLI Hub</span></h1><p class="subtitle">${title}</p></div></section>
 <div class="stats"><div class="stat">ϟ &nbsp;${tools.length} Tools</div><div class="stat">⬡ &nbsp;Open Source</div><div class="stat">↗ &nbsp;Fast & Lightweight</div><div class="stat">♥ &nbsp;Developer Friendly</div></div>
 ${view==="about"?'<div class="detail-panel detail"><h2>About OCode.js CLI Hub</h2><p>A curated directory of terminal utilities, developer tools and AI-agent workflows.</p><p>Every install command is shown for reference. Review upstream documentation before running it.</p><a class="btn primary" href="https://github.com/zskbot/ocodejs-cli">Explore source ↗</a></div>':`
 <div class="searchbar"><label class="searchbox">⌕ <input id="search" type="search" placeholder="Search tools… (e.g. ripgrep, fzf)" value="${esc(query)}" aria-label="Search tools" enterkeyhint="search" autocomplete="off"></label><select class="filter" id="category" aria-label="Filter category"><option value="">All Categories</option>${categories.map(c=>`<option value="${esc(c)}" ${c===category?"selected":""}>${esc(c)}</option>`).join("")}</select><select class="filter" id="language" aria-label="Filter language"><option value="">All Languages</option>${languages.map(l=>`<option value="${esc(l)}" ${l===language?"selected":""}>${esc(l)}</option>`).join("")}</select><button class="search-submit" id="search-submit" type="button">Search</button></div>
 <div class="section-head" id="tools"><h2>${view==="favorites"?"Saved tools":"Available tools"}</h2><span class="result-count">${result.length} / ${tools.length} tools</span></div><div class="grid">${result.length?result.map(card).join(""):'<div class="empty">No tools found. Adjust your search or filters.</div>'}</div>`}`;
 const input=$("#search");if(input){input.addEventListener("input",()=>{query=input.value;renderKeepFocus()});input.addEventListener("keydown",e=>{if(e.key==="Enter")input.blur()});$("#category").addEventListener("change",e=>{category=e.target.value;render()});$("#language").addEventListener("change",e=>{language=e.target.value;render()});$("#search-submit").addEventListener("click",render)}
}
function renderKeepFocus(){const pos=$("#search")?.selectionStart;render();const input=$("#search");input?.focus({preventScroll:true});if(pos!==undefined)input?.setSelectionRange(pos,pos)}
function detail(id){const t=tools.find(x=>x.id===id);if(!t)return;$("#app").innerHTML=`<div class="detail"><button class="back" id="back" type="button">← Back to tools</button><h2>${esc(t.name)}</h2><p>${esc(t.description)}</p><p class="meta">${esc(t.language)} · ${esc(t.category)}</p><div class="detail-panel"><strong>INSTALL COMMAND</strong><pre class="command">${esc(t.install)}</pre><button class="btn primary" data-copy="${esc(t.install)}" type="button">Copy command</button></div><div class="detail-panel"><strong>UPSTREAM REPOSITORY</strong><p><a href="${esc(t.repo)}" target="_blank" rel="noopener noreferrer">${esc(t.repo)} ↗</a></p></div></div>`;$("#back").addEventListener("click",render);window.scrollTo(0,0)}
document.addEventListener("click",e=>{
 const nav=e.target.closest("[data-nav]");if(nav){e.preventDefault();const n=nav.dataset.nav;view=n==="favorites"?"favorites":n==="about"?"about":"home";category="";language="";query="";document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("active",a===nav));render();if(n==="tools")$("#tools")?.scrollIntoView();else window.scrollTo(0,0);return}
 const d=e.target.closest("[data-detail]");if(d){detail(d.dataset.detail);return}
 const f=e.target.closest("[data-fav]");if(f){const id=f.dataset.fav;favorites.has(id)?favorites.delete(id):favorites.add(id);try{localStorage.setItem("ocodejs-cli-favorites",JSON.stringify([...favorites]))}catch{}const y=window.scrollY;render();window.scrollTo(0,y);return}
 const c=e.target.closest("[data-copy]");if(c){const old=c.textContent;const done=t=>{c.textContent=t;setTimeout(()=>{c.textContent=old},1500)};navigator.clipboard?.writeText(c.dataset.copy).then(()=>done("Copied ✓")).catch(()=>done("Copy failed"));return}
});
$("#focus-search").addEventListener("click",()=>$("#search")?.focus());
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#search")?.focus()}if(e.key==="/"&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||"")){e.preventDefault();$("#search")?.focus()}});
$("#theme-toggle").addEventListener("click",()=>{document.body.classList.toggle("light-preview");const l=document.body.classList.contains("light-preview");document.documentElement.style.colorScheme=l?"light":"dark";$("#theme-toggle").textContent=l?"☀":"☾";document.querySelector('meta[name=theme-color]').content=l?"#f7f9fd":"#05070d"});
fetch("tools.json").then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(data=>{tools=data;render()}).catch(err=>{$("#app").innerHTML='<div class="empty">Unable to load tools.json. Open this page through GitHub Pages or a local static server.</div>';console.error(err)});
</script>
</body>
</html>
