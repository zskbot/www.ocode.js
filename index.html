<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>OCode.js CLI Hub — Developer tools</title>
<meta name="description" content="Khám phá, tìm kiếm và sử dụng các công cụ CLI/TUI dành cho developer và AI agents.">
<link rel="canonical" href="https://zskbot.github.io/ocodejs-cli/">
<meta property="og:type" content="website">
<meta property="og:title" content="OCode.js CLI Hub">
<meta property="og:description" content="Developer tools, terminal-first.">
<meta property="og:url" content="https://zskbot.github.io/ocodejs-cli/">
<style>
:root{color-scheme:dark;--bg:#05070d;--surface:#080c15;--panel:#0a101c;--line:#26364f;--line-strong:#36577f;--fg:#f2f5fb;--muted:#a3afc2;--blue:#347cff;--cyan:#55c8ff;--purple:#a34cff;--yellow:#f3d44e;--pink:#e45ac8;--green:#57d6a2;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--mono)}
button,input,select,textarea{font:inherit}
a{color:inherit;text-decoration:none}
button,a,input,select{touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
button{cursor:pointer}
.layout{min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:64px 1fr auto;max-width:1680px;margin:0 auto;border:1px solid var(--line);background:linear-gradient(135deg,#070b13,#05070d 55%)}
.sidebar{grid-column:1;grid-row:1/4;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;min-height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 26px;border-bottom:1px solid var(--line);font-weight:800;font-size:20px;letter-spacing:-1px}
.brand-mark{font-size:34px;line-height:1;color:var(--blue);text-shadow:5px 4px 0 var(--purple)}
.brand small{display:block;color:var(--blue);font-size:12px;letter-spacing:1px}
.nav{display:grid;gap:6px;margin-top:24px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid transparent;color:var(--muted);font-size:14px}
.nav a:hover,.nav a.active{background:#173c9c;border-color:#356fff;color:#fff}
.nav-icon{width:18px;text-align:center;font-size:16px}
.side-card{margin-top:auto;border:1px solid var(--line-strong);padding:12px;background:#080e19}
.side-card strong{display:block;margin-bottom:5px}
.side-card p{margin:0;color:var(--muted);font-size:12px}
.version{display:inline-block;margin-top:10px;border:1px solid var(--purple);padding:2px 7px;color:#c9a2ff;font-size:11px}
.topbar{grid-column:2;grid-row:1;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:0 22px}
.icon-button,.shortcut{height:38px;min-width:40px;border:1px solid var(--line-strong);border-radius:0;background:transparent;color:var(--fg);padding:0 12px}
.shortcut{display:flex;align-items:center;gap:10px;color:var(--muted)}
.content{grid-column:2;grid-row:2;min-width:0;padding:clamp(22px,4vw,48px)}
.hero{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:24px;margin:0 0 26px}
.hero-mark{font-size:74px;line-height:1;color:var(--blue);text-shadow:10px 7px 0 var(--purple)}
h1{margin:0;font-size:clamp(28px,4vw,54px);line-height:1.1;letter-spacing:-2px}
h1 span{color:var(--blue)}
.subtitle{margin:12px 0 0;color:var(--muted);font-size:15px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 30px}
.stat{min-height:42px;display:flex;align-items:center;gap:10px;border:1px solid var(--line-strong);padding:8px 14px;background:#080e19}
.stat:nth-child(1){border-color:#c3a92c;color:var(--yellow)}
.stat:nth-child(2){border-color:#267db5;color:var(--cyan)}
.stat:nth-child(3){border-color:#8b42d3;color:#c28bff}
.stat:nth-child(4){border-color:#4a9fbd;color:#8de4ff}
.searchbar{display:grid;grid-template-columns:minmax(0,1fr) 190px 190px 120px;gap:12px;margin-bottom:28px}
.searchbox,.filter,.search-submit{height:52px;border:1px solid var(--line-strong);border-radius:0;background:#070c15;color:var(--fg);padding:0 15px;min-width:0}
.searchbox{display:flex;align-items:center;gap:12px}
.searchbox input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--fg)}
.searchbox input:focus-visible{outline:0}
.filter{width:100%;appearance:none}
.search-submit{background:#2859e8;border-color:#3c70ff;color:#fff;font-weight:700}
.search-submit:hover{background:#3970ff}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 12px}
.section-head h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.result-count{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{min-width:0;border:1px solid var(--line-strong);background:linear-gradient(145deg,#0a101b,#070b13);padding:15px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.card:nth-child(4n+1){border-top:2px solid var(--blue)}
.card:nth-child(4n+2){border-top:2px solid var(--purple)}
.card:nth-child(4n+3){border-top:2px solid var(--cyan)}
.card:nth-child(4n){border-top:2px solid var(--pink)}
.card:hover{border-color:var(--blue)}
.card-head{display:flex;align-items:center;gap:12px}
.tool-icon{width:44px;height:44px;display:grid;place-items:center;border:2px solid var(--cyan);color:var(--cyan);font-weight:800;font-size:15px}
.card:nth-child(4n+2) .tool-icon{border-color:var(--purple);color:#c69aff}
.card:nth-child(4n) .tool-icon{border-color:var(--pink);color:#f08add}
.card h3{margin:0;font-size:16px;overflow-wrap:anywhere}
.card p{min-height:44px;margin:0;color:var(--muted);font-size:12px}
.meta{display:flex;align-items:center;gap:10px;color:var(--blue);font-size:12px}
.meta span+span{color:var(--muted)}
.card-actions{display:flex;align-items:center;gap:7px;margin-top:auto;flex-wrap:wrap}
.btn{min-height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-strong);border-radius:0;background:#0a1322;color:var(--fg);padding:6px 10px;font-size:11px}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.primary{background:#173d9f;border-color:#3976ff;color:#fff}
.btn.favorite[aria-pressed=true]{color:var(--yellow);border-color:var(--yellow)}
.empty{grid-column:1/-1;border:1px dashed var(--line-strong);padding:28px;text-align:center;color:var(--muted)}
.detail{max-width:760px}
.detail h2{font-size:30px}
.detail-panel{margin-top:16px;border:1px solid var(--line-strong);padding:16px;background:var(--panel)}
.command{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--green);font-size:12px}
.back{height:38px;border:1px solid var(--line-strong);border-radius:0;background:transparent;color:var(--fg);padding:0 12px}
footer{grid-column:2;grid-row:3;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding:16px 22px;color:var(--muted);font-size:12px}
footer a{padding:0 8px}
@media(max-width:1100px){.searchbar{grid-template-columns:minmax(0,1fr) 1fr 1fr}.search-submit{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.layout{grid-template-columns:1fr;grid-template-rows:auto 54px 1fr auto;border:0}.sidebar{grid-column:1;grid-row:1;min-height:0;padding:12px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:4px 6px 12px;font-size:17px}.brand-mark{font-size:28px}.nav{display:flex;overflow-x:auto;margin-top:10px;gap:5px;padding-bottom:2px}.nav a{white-space:nowrap;padding:8px 10px;font-size:12px}.side-card{display:none}.topbar{grid-column:1;grid-row:2;padding:0 12px}.content{grid-column:1;grid-row:3;padding:22px 14px}.hero{grid-template-columns:1fr;gap:8px}.hero-mark{display:none}h1{font-size:clamp(27px,8vw,40px)}.subtitle{font-size:13px}.stats{gap:7px;margin:18px 0 22px}.stat{font-size:11px;padding:7px 9px;min-height:36px}.searchbar{grid-template-columns:1fr 1fr;gap:8px}.searchbox{grid-column:1/-1}.filter,.searchbox,.search-submit{height:46px}.search-submit{grid-column:1/-1}.grid{grid-template-columns:1fr}.card p{min-height:0}.section-head{margin-top:20px}footer{grid-column:1;grid-row:4;padding:14px;font-size:10px}}
.light-preview .layout{background:#edf2fb;color:#101827}.light-preview .sidebar,.light-preview .topbar,.light-preview footer{background:#f7f9fd;color:#263449}.light-preview .brand small,.light-preview .meta,.light-preview .result-count{color:#245ac7}.light-preview .nav a{color:#34445c}.light-preview .nav a:hover,.light-preview .nav a.active{background:#dce8ff;color:#102b61}.light-preview .side-card,.light-preview .card,.light-preview .detail-panel,.light-preview .searchbox,.light-preview .filter,.light-preview .shortcut,.light-preview .icon-button,.light-preview .btn{background:#fff;color:#17243a}.light-preview .card p,.light-preview .section-head h2,.light-preview .subtitle{color:#52627a}.light-preview .command{background:#f2f6fc;color:#08764d}.light-preview .stat{background:#fff}.light-preview .card{border-color:#9eb4d4}.light-preview .layout{border-color:#9eb4d4}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<a class="brand" href="#" aria-label="OCode.js CLI Hub"><span class="brand-mark">&gt;_</span><span>OCode.js<small>CLI HUB</small></span></a>
<nav class="nav" aria-label="Main navigation">
<a class="active" href="#" data-nav="home"><span class="nav-icon">⌂</span>Home</a>
<a href="#tools" data-nav="tools"><span class="nav-icon">▦</span>Tools</a>
<a href="#favorites" data-nav="favorites"><span class="nav-icon">★</span>Favorites</a>
<a href="https://github.com/zskbot/ocodejs-cli#readme" target="_blank" rel="noopener noreferrer"><span class="nav-icon">▤</span>Docs</a>
<a href="https://github.com/zskbot/ocodejs-cli" target="_blank" rel="noopener noreferrer"><span class="nav-icon">◉</span>GitHub</a>
<a href="#about" data-nav="about"><span class="nav-icon">ⓘ</span>About</a>
</nav>
<div class="side-card"><strong>OCode.js</strong><p>Open-source CLI hub for developers and AI agents.</p><span class="version">v1.0.0</span></div>
</aside>
<header class="topbar"><button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle theme">☾</button><button class="shortcut" id="focus-search" type="button">⌕ <span>Ctrl + K</span></button></header>
<main class="content" id="app" aria-live="polite"><p>Loading catalog…</p></main>
<footer><span>© 2026 OCode.js. Open-source developer tools.</span><span><a href="https://github.com/zskbot/ocodejs-cli">GitHub</a> | <a href="https://github.com/zskbot/ocodejs-cli#readme">Docs</a> | <a href="https://github.com/zskbot/ocodejs-cli/issues/new">Contribute</a> | <a href="https://github.com/zskbot/ocodejs-cli/blob/main/LICENSE">License</a></span></footer>
</div>
<script>
"use strict";
const REPO="zskbot/ocodejs-cli";
const $=s=>document.querySelector(s);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tools=[],query="",category="",language="",view="home",favorites=new Set();
try{favorites=new Set(JSON.parse(localStorage.getItem("ocodejs-cli-favorites")||"[]"))}catch{}
const icons={"ripgrep":"rg","fd":"fd","fzf":"fzf","lazygit":"lg","k9s":"k9s","jq":"jq","yq":"yq","dnspyre":"dns","cli-anything-hub":"AI","clihub":"CH"};
function filtered(){const q=query.trim().toLocaleLowerCase("vi");return tools.filter(t=>(!category||t.category===category)&&(!language||t.language===language)&&(!q||[t.name,t.description,t.language,t.category,t.install].join(" ").toLocaleLowerCase("vi").includes(q))&&(view!=="favorites"||favorites.has(t.id)))}
function card(t){return `<article class="card"><div class="card-head"><span class="tool-icon">${esc(icons[t.id]||t.name.slice(0,3))}</span><h3>${esc(t.name)}</h3></div><p>${esc(t.description)}</p><div class="meta"><span>${esc(t.language)}</span><span>• ${esc(t.category)}</span></div><div class="card-actions"><button class="btn primary" data-detail="${esc(t.id)}" type="button">View →</button><button class="btn" data-copy="${esc(t.install)}" type="button">Copy</button><a class="btn" href="${esc(t.repo)}" target="_blank" rel="noopener noreferrer">GitHub ↗</a><button class="btn favorite" data-fav="${esc(t.id)}" aria-pressed="${favorites.has(t.id)}" aria-label="Toggle favorite" type="button">${favorites.has(t.id)?"★":"☆"}</button></div></article>`}
function render(){
 const result=filtered(),categories=[...new Set(tools.map(t=>t.category))].sort(),languages=[...new Set(tools.map(t=>t.language))].sort();
 const title=view==="favorites"?"Favorites":view==="about"?"About OCode.js":"Discover, explore and use the best CLI tools for developers.";
 $("#app").innerHTML=`<section class="hero"><div class="hero-mark">&gt;_</div><div><h1>OCode.js <span>CLI Hub</span></h1><p class="subtitle">${title}</p></div></section>
 <div class="stats"><div class="stat">ϟ &nbsp;${tools.length} Tools</div><div class="stat">⬡ &nbsp;Open Source</div><div class="stat">↗ &nbsp;Fast & Lightweight</div><div class="stat">♥ &nbsp;Developer Friendly</div></div>
 ${view==="about"?'<div class="detail-panel detail"><h2>About OCode.js CLI Hub</h2><p>A curated directory of terminal utilities, developer tools and AI-agent workflows.</p><p>Every install command is shown for reference. Review upstream documentation before running it.</p><a class="btn primary" href="https://github.com/zskbot/ocodejs-cli">Explore source ↗</a></div>':`
 <div class="searchbar"><label class="searchbox">⌕ <input id="search" type="search" placeholder="Search tools… (e.g. ripgrep, fzf)" value="${esc(query)}" aria-label="Search tools"></label><select class="filter" id="category" aria-label="Filter category"><option value="">All Categories</option>${categories.map(c=>`<option value="${esc(c)}" ${c===category?"selected":""}>${esc(c)}</option>`).join("")}</select><select class="filter" id="language" aria-label="Filter language"><option value="">All Languages</option>${languages.map(l=>`<option value="${esc(l)}" ${l===language?"selected":""}>${esc(l)}</option>`).join("")}</select><button class="search-submit" id="search-submit" type="button">Search</button></div>
 <div class="section-head" id="tools"><h2>${view==="favorites"?"Saved tools":"Available tools"}</h2><span class="result-count">${result.length} / ${tools.length} tools</span></div><div class="grid">${result.length?result.map(card).join(""):'<div class="empty">No tools found. Adjust your search or filters.</div>'}</div>`}`;
 const input=$("#search");if(input){input.addEventListener("input",()=>{query=input.value;renderKeepFocus()});$("#category").addEventListener("change",e=>{category=e.target.value;render()});$("#language").addEventListener("change",e=>{language=e.target.value;render()});$("#search-submit").addEventListener("click",render)}
}
function renderKeepFocus(){const pos=$("#search")?.selectionStart;render();const input=$("#search");input?.focus();if(pos!==undefined)input?.setSelectionRange(pos,pos)}
function detail(id){const t=tools.find(x=>x.id===id);if(!t)return;$("#app").innerHTML=`<div class="detail"><button class="back" id="back">← Back to tools</button><h2>${esc(t.name)}</h2><p>${esc(t.description)}</p><p class="meta">${esc(t.language)} · ${esc(t.category)}</p><div class="detail-panel"><strong>INSTALL COMMAND</strong><pre class="command">${esc(t.install)}</pre><button class="btn primary" data-copy="${esc(t.install)}">Copy command</button></div><div class="detail-panel"><strong>UPSTREAM REPOSITORY</strong><p><a href="${esc(t.repo)}" target="_blank" rel="noopener noreferrer">${esc(t.repo)} ↗</a></p></div></div>` ;$("#back").addEventListener("click",render)}
document.addEventListener("click",e=>{
 const nav=e.target.closest("[data-nav]");if(nav){e.preventDefault();view=nav.dataset.nav==="favorites"?"favorites":nav.dataset.nav==="about"?"about":"home";category="";language="";query="";document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("active",a===nav));render();return}
 const d=e.target.closest("[data-detail]");if(d){detail(d.dataset.detail);return}
 const f=e.target.closest("[data-fav]");if(f){const id=f.dataset.fav;favorites.has(id)?favorites.delete(id):favorites.add(id);localStorage.setItem("ocodejs-cli-favorites",JSON.stringify([...favorites]));render();return}
 const c=e.target.closest("[data-copy]");if(c){navigator.clipboard?.writeText(c.dataset.copy).then(()=>{c.textContent="Copied ✓"}).catch(()=>{c.textContent="Copy failed"});return}
});
$("#focus-search").addEventListener("click",()=>$("#search")?.focus());
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#search")?.focus()}if(e.key==="/"&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||"")){e.preventDefault();$("#search")?.focus()}});
$("#theme-toggle").addEventListener("click",()=>{document.body.classList.toggle("light-preview");document.documentElement.style.colorScheme=document.body.classList.contains("light-preview")?"light":"dark"});
fetch("tools.json").then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(data=>{tools=data;render()}).catch(err=>{$("#app").innerHTML='<div class="empty">Unable to load tools.json. Open this page through GitHub Pages or a local static server.</div>';console.error(err)});
</script>
</body>
</html>
