name: Validate tool catalog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate catalog and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tool catalog
        run: npm run validate
      - name: Run unit tests
        run: npm test
